<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>fixture: 팝업</title>
  <style>
    body { font: 14px/1.5 system-ui, 'Malgun Gothic', sans-serif; margin: 16px; }
    .controls { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; }
    .wrap { display: flex; gap: 16px; align-items: flex-start; }
    #page { flex: 1; min-width: 0; height: 640px; border: 1px solid #ccc; }
    #popup { flex: none; width: 260px; height: 200px; border: 1px solid #888; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <!-- 실제 팝업(src/popup/popup.html)을 그대로 띄우고, 옆의 코네 흉내 페이지와 가짜 chrome API로 연결한다. -->
  <div class="controls">
    <label>탭 페이지
      <select id="target">
        <option value="kone-post.html">게시물 (kone-post.html)</option>
        <option value="kone-list.html">목록 (kone-list.html)</option>
        <option value="none">코네가 아닌 탭</option>
        <option value="no-script">콘텐츠 스크립트가 없는 코네 탭</option>
      </select>
    </label>
  </div>
  <div class="wrap">
    <iframe id="popup" title="팝업"></iframe>
    <iframe id="page" title="탭 페이지"></iframe>
  </div>

  <script>
    const page = document.getElementById('page');
    const popup = document.getElementById('popup');
    const target = document.getElementById('target');

    async function open() {
      const mode = target.value;
      const src = mode === 'none' || mode === 'no-script' ? 'about:blank' : mode;
      await new Promise((resolve) => { page.onload = resolve; page.src = src; });
      const w = page.contentWindow;
      // about:blank에도 브라우저 기본 window.chrome이 있으므로 storage 유무로 판단한다.
      const storageChrome = w.chrome && w.chrome.storage ? w.chrome : {
        // 콘텐츠 스크립트가 없는 탭: 저장소만 따로 흉내
        storage: { sync: { get: async () => ({}), set: async () => {} }, onChanged: { addListener() {}, removeListener() {} } },
        runtime: { onMessage: { addListener() {} } },
      };
      window.__popupChrome = {
        storage: storageChrome.storage,
        runtime: storageChrome.runtime,
        tabs: {
          query: async () => [{ id: 1, url: mode === 'none' ? 'https://example.com/' : 'https://kone.gg/s/somisoft/test' }],
          sendMessage: async (id, message) => {
            if (!w.__stub) throw new Error('Could not establish connection. Receiving end does not exist.');
            return w.__stub.sendMessage(message);
          },
        },
      };
      const html = await fetch('../../src/popup/popup.html').then((r) => r.text());
      popup.srcdoc = html.replace('<head>', '<head><base href="../../src/popup/"><script>window.chrome = parent.__popupChrome;<\/script>');
    }

    target.onchange = open;
    open();
  </script>
</body>
</html>
