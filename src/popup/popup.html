<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>코네 Base64 디코더</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../../icons/icon-48.png" width="32" height="32" alt="">
    <div>
      <h1>코네 Base64 디코더</h1>
      <p class="version" id="version"></p>
    </div>
  </header>

  <main>
    <label class="card main-toggle">
      <span class="text">
        <span class="title">자동 디코딩</span>
        <span class="desc" id="enabled-desc">코네의 Base64 문장을 자동으로 풀어 줍니다</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="enabled" data-setting="enabled">
        <span class="slider" aria-hidden="true"></span>
      </span>
    </label>

    <section class="card options" id="options">
      <h2>디코딩 범위·표시</h2>
      <label class="row">
        <span class="text">
          <span class="title">글 제목·목록 제목</span>
          <span class="desc"><code>Qw==</code>처럼 짧은 Base64도 풉니다</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="decodeTitles" data-setting="decodeTitles">
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
      <label class="row">
        <span class="text">
          <span class="title">주소는 링크로 표시</span>
          <span class="desc">풀린 주소를 눌러서 바로 열 수 있습니다</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="linkify" data-setting="linkify">
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
    </section>
  </main>

  <footer>바꾼 설정은 열려 있는 코네 탭에 바로 적용됩니다.</footer>

  <script src="../lib/browser-api.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
